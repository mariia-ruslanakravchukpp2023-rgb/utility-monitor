<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реєстрація</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="register-page">

  <nav>
    <h2>Utility Monitor</h2>

    <div>
      <a href="index.html">Головна</a>
      <a href="login.html">Вхід</a>
    </div>
  </nav>

  <button class="menu-btn" onclick="toggleMenu()">
    ☰
  </button>

  <div id="sideMenu" class="side-menu">
    <a href="index.html">🏠 Головна</a>
    <a href="about.html">ℹ️ Про систему</a>
    <a href="login.html">🔑 Вхід</a>
    <a href="register.html">👤 Реєстрація</a>
  </div>

  <main class="form-page">

    <section class="card">

      <h1>Реєстрація</h1>

      <input
        type="text"
        id="regName"
        placeholder="Ім'я"
        autocomplete="off"
      >

      <input
        type="email"
        id="regEmail"
        placeholder="Email"
        autocomplete="off"
      >

      <input
        type="password"
        id="regPassword"
        placeholder="Пароль"
        autocomplete="new-password"
      >

      <button onclick="register()">
        Зареєструватися
      </button>

      <p>
        Вже маєте акаунт?
        <a href="login.html">
          Увійти
        </a>
      </p>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
