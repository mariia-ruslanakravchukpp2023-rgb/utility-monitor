<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабінет</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-page" onload="loadDashboard()">

  <nav>
    <h2>Utility Monitor</h2>

    <div>
      <a href="dashboard.html">Кабінет</a>
      <a href="add-reading.html">Додати показник</a>
      <a href="history.html">Історія</a>
      <a href="analytics.html">Аналітика</a>
      <a href="tips.html">Поради</a>
      <a href="/api/auth/logout">Вийти</a>
    </div>
  </nav>

  <button class="menu-btn" onclick="toggleMenu()">
    ☰
  </button>

  <div id="sideMenu" class="side-menu">
    <a href="dashboard.html">🏠 Кабінет</a>
    <a href="add-reading.html">➕ Додати показник</a>
    <a href="history.html">📋 Історія</a>
    <a href="analytics.html">📊 Аналітика</a>
    <a href="tips.html">💡 Поради</a>
    <a href="/api/auth/logout">🚪 Вийти</a>
  </div>

  <main class="container">

    <h1>Особистий кабінет</h1>

    <p id="userInfo"></p>

    <section class="grid">

      <div class="stat-card">
        <h3>Загальна сума</h3>
        <p>
          <span id="dashTotal">0</span> грн
        </p>
      </div>

      <div class="stat-card">
        <h3>Кількість записів</h3>
        <p>
          <span id="dashCount">0</span>
        </p>
      </div>

      <div class="stat-card">
        <h3>Найдорожча послуга</h3>
        <p id="dashMax">—</p>
      </div>

    </section>

    <section class="card">

      <h2>Налаштування рекомендацій</h2>

      <label>Наявність додаткових систем економії</label>

      <select id="hasBoiler">
        <option value="false">Бойлер не встановлений</option>
        <option value="true">Є бойлер</option>
      </select>

      <select id="hasDualZoneMeter">
        <option value="false">Немає двозонного лічильника</option>
        <option value="true">Є двозонний лічильник</option>
      </select>

      <label>Кількість мешканців</label>

      <input
        type="number"
        id="peopleCount"
        min="1"
      >

      <button onclick="saveRecommendationSettings()">
        Зберегти налаштування
      </button>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
