<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Аналітика</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="analytics-page" onload="loadAnalytics()">

  <nav>
    <h2>Utility Monitor</h2>
    <div>
      <a href="dashboard.html">Кабінет</a>
      <a href="add-reading.html">Додати показник</a>
      <a href="history.html">Історія</a>
      <a href="tips.html">Поради</a>
    </div>
  </nav>

  <button class="menu-btn" onclick="toggleMenu()">
    ☰
  </button>

  <div id="sideMenu" class="side-menu">
    <a href="dashboard.html">🏠 Кабінет</a>
    <a href="add-reading.html">➕ Додати показник</a>
    <a href="history.html">📋 Історія</a>
    <a href="analytics.html">📊 Аналітика</a>
    <a href="tips.html">💡 Поради</a>
    <a href="/api/auth/logout">🚪 Вийти</a>
  </div>

  <main class="container">
    <h1>Аналітика витрат</h1>

    <section class="grid four">
      <div class="stat-card">
        <h3>Електроенергія</h3>
        <p><span id="electricityTotal">0</span> грн</p>
      </div>

      <div class="stat-card">
        <h3>Вода</h3>
        <p><span id="waterTotal">0</span> грн</p>
      </div>

      <div class="stat-card">
        <h3>Газ</h3>
        <p><span id="gasTotal">0</span> грн</p>
      </div>

      <div class="stat-card">
        <h3>Опалення</h3>
        <p><span id="heatingTotal">0</span> грн</p>
      </div>
    </section>

    <section class="card">
      <h2>Висновок системи</h2>
      <p id="analyticsConclusion">Дані ще не завантажені.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
